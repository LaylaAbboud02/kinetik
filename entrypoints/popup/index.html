<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetik</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div class="popup__title-group">
          <h1 class="popup__title">Kinetik</h1>
          <!-- Hover or focus (click/Tab) reveals the shortcut cheat sheet. The
               list is filled from the user's saved bindings in main.ts. -->
          <div class="popup__help">
            <button
              class="popup__help-btn"
              type="button"
              aria-label="Keyboard shortcuts"
              aria-describedby="shortcut-help"
            >
              i
            </button>
            <div id="shortcut-help" class="popup__help-panel" role="tooltip">
              <p class="popup__help-title">Keyboard shortcuts</p>
              <ul id="shortcut-list" class="popup__help-list"></ul>
              <p class="popup__help-note">
                Click the video first so the keys reach it. Change them in
                Settings below.
              </p>
            </div>
          </div>
        </div>
        <span id="speed-readout" class="popup__readout">1×</span>
      </header>

      <input
        id="speed-slider"
        class="popup__slider"
        type="range"
        min="0.25"
        max="16"
        step="0.1"
        value="1"
        aria-label="Playback speed"
      />

      <div class="popup__row">
        <button id="reset-btn" class="popup__btn" type="button">Reset to 1×</button>
      </div>

      <hr class="popup__divider" />

      <div class="popup__row popup__row--between">
        <span class="popup__label">This site</span>
        <span id="profile-readout" class="popup__mono">Not saved</span>
      </div>
      <div class="popup__row">
        <button id="save-profile-btn" class="popup__btn" type="button">
          Save for this site
        </button>
        <button id="remove-profile-btn" class="popup__btn" type="button" hidden>
          Remove
        </button>
      </div>

      <hr class="popup__divider" />

      <div class="popup__row popup__row--between">
        <label class="popup__label" for="skip-silence-toggle">Skip silence</label>
        <input id="skip-silence-toggle" type="checkbox" />
      </div>

      <div class="popup__row popup__row--between">
        <label class="popup__label popup__label--small" for="threshold-slider">
          Sensitivity
        </label>
        <span id="threshold-readout" class="popup__mono">0.020</span>
      </div>
      <input
        id="threshold-slider"
        class="popup__slider"
        type="range"
        min="0.001"
        max="0.1"
        step="0.001"
        value="0.02"
        aria-label="Silence sensitivity"
      />

      <!-- Live audio level vs. the threshold, so the slider can be tuned by
           eye: anything left of the marker counts as silence. -->
      <div class="popup__meter" title="Live audio level">
        <div id="level-fill" class="popup__meter-fill"></div>
        <div id="level-marker" class="popup__meter-marker"></div>
      </div>
      <div class="popup__row popup__row--between">
        <span class="popup__label--small">Level</span>
        <span id="level-readout" class="popup__mono">—</span>
      </div>

      <p id="skip-silence-note" class="popup__status"></p>

      <hr class="popup__divider" />

      <div class="popup__row popup__row--between">
        <span class="popup__label">Loop</span>
        <span id="loop-readout" class="popup__mono">No loop set</span>
      </div>
      <div class="popup__row">
        <button id="clear-loop-btn" class="popup__btn" type="button" disabled>
          Clear loop
        </button>
      </div>

      <hr class="popup__divider" />

      <span class="popup__label">Notes</span>
      <ul id="notes-list" class="popup__notes"></ul>

      <p id="status" class="popup__status"></p>

      <button id="open-options-btn" class="popup__link" type="button">
        Settings — profiles &amp; shortcuts
      </button>
    </main>

    <!-- type="module" lets us use import statements; WXT/Vite bundles this. -->
    <script type="module" src="./main.ts"></script>
  </body>
</html>
