<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetik</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1 class="popup__title">Kinetik</h1>
        <span id="speed-readout" class="popup__readout">1×</span>
      </header>

      <input
        id="speed-slider"
        class="popup__slider"
        type="range"
        min="0.25"
        max="16"
        step="0.1"
        value="1"
        aria-label="Playback speed"
      />

      <div class="popup__row">
        <button id="reset-btn" class="popup__btn" type="button">Reset to 1×</button>
      </div>

      <p id="status" class="popup__status"></p>
    </main>

    <!-- type="module" lets us use import statements; WXT/Vite bundles this. -->
    <script type="module" src="./main.ts"></script>
  </body>
</html>
